
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXORA - Open World Adventure</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#071322;font-family:Arial;color:white}
canvas{display:block}
#hud{position:fixed;top:15px;left:15px;z-index:2;
background:#071322cc;padding:15px;border:1px solid #e5b943;
border-radius:12px;min-width:190px}
#hud h2{margin:0 0 10px;color:#ffd45c;font-size:19px}
#mission{font-size:14px;line-height:1.7}
#message{position:fixed;top:18px;left:50%;transform:translateX(-50%);
background:#071322dd;padding:12px 20px;border-radius:12px;
text-align:center;z-index:3;color:#ffe08a}
#menu{position:fixed;inset:0;z-index:5;background:#061321dd;
display:flex;align-items:center;justify-content:center;text-align:center}
.panel{background:#10243a;padding:30px;border:1px solid #d7ae45;
border-radius:18px;width:min(90%,420px)}
.panel h1{color:#ffd45c;font-size:30px}
button{background:#e7b83f;color:#172033;border:0;
padding:13px 24px;border-radius:9px;font-weight:bold;
cursor:pointer;font-size:16px}
#help{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);
background:#071322bb;padding:9px 14px;border-radius:10px;
font-size:12px;text-align:center;z-index:2}
#touch{position:fixed;bottom:70px;right:15px;z-index:3;
display:none;grid-template-columns:repeat(3,48px);gap:5px}
#touch button{padding:12px 0;font-size:18px}
@media(pointer:coarse){#touch{display:grid}#help{bottom:8px}}
</style>
</head>
<body>

<div id="hud">
<h2>NEXORA ADVENTURE</h2>
<div id="mission">
Crystals: <b id="score">0 / 12</b><br>
Health: <b>100%</b><br>
Mission: Find the portal
</div>
</div>

<div id="message">Explore the island and find 12 crystals!</div>

<div id="menu">
<div class="panel">
<h1>NEXORA</h1>
<h3>OPEN WORLD ADVENTURE</h3>
<p>Explore a mysterious island, collect crystals and discover the ancient portal.</p>
<button id="start">START ADVENTURE</button>
</div>
</div>

<div id="help">
W A S D / Arrow Keys = Move | SPACE = Jump | SHIFT = Run
</div>

<div id="touch">
<button data-key="w">▲</button>
<button data-key="w">↑</button>
<button data-key="w">▲</button>
<button data-key="a">◀</button>
<button data-key="s">▼</button>
<button data-key="d">▶</button>
</div>

<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
 }
}
</script>

<script type="module">
import * as THREE from "three";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87c9ed);
scene.fog = new THREE.Fog(0x87c9ed, 65, 180);

const camera = new THREE.PerspectiveCamera(
 65, innerWidth/innerHeight, 0.1, 250
);

const renderer = new THREE.WebGLRenderer({
 antialias:false
});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.25));
renderer.shadowMap.enabled = false;
document.body.appendChild(renderer.domElement);

// LIGHTS
scene.add(new THREE.HemisphereLight(0xffffff,0x426047,2));

const sun = new THREE.DirectionalLight(0xffffff,1.5);
sun.position.set(-30,60,30);
scene.add(sun);

// WATER
const water = new THREE.Mesh(
 new THREE.PlaneGeometry(240,240),
 new THREE.MeshLambertMaterial({color:0x258db4})
);
water.rotation.x=-Math.PI/2;
water.position.y=-1.2;
scene.add(water);

// ISLAND
const island = new THREE.Mesh(
 new THREE.CircleGeometry(90,64),
 new THREE.MeshLambertMaterial({color:0x5b9b45})
);
island.rotation.x=-Math.PI/2;
island.position.y=-0.2;
scene.add(island);

// BEACH RING
const beach = new THREE.Mesh(
 new THREE.RingGeometry(83,90,64),
 new THREE.MeshLambertMaterial({color:0xd9c28a,side:THREE.DoubleSide})
);
beach.rotation.x=-Math.PI/2;
beach.position.y=-0.1;
scene.add(beach);

// PLAYER
const player = new THREE.Group();

const body = new THREE.Mesh(
 new THREE.CapsuleGeometry(0.55,1.1,4,8),
 new THREE.MeshLambertMaterial({color:0x2878e8})
);
body.position.y=1.15;
player.add(body);

const head = new THREE.Mesh(
 new THREE.SphereGeometry(0.42,10,8),
 new THREE.MeshLambertMaterial({color:0xffc69b})
);
head.position.y=2.15;
player.add(head);

scene.add(player);
player.position.set(0,0,25);

// TREES
function makeTree(x,z){
 const tree=new THREE.Group();

 const trunk=new THREE.Mesh(
  new THREE.CylinderGeometry(.35,.5,2.5,6),
  new THREE.MeshLambertMaterial({color:0x79502e})
 );
 trunk.position.y=1.25;
 tree.add(trunk);

 for(let i=0;i<3;i++){
  const leaves=new THREE.Mesh(
   new THREE.ConeGeometry(2.2-i*.35,3,7),
   new THREE.MeshLambertMaterial({
    color:[0x236b36,0x328342,0x286e40][i]
   })
  );
  leaves.position.y=3.1+i*1.25;
  tree.add(leaves);
 }
 tree.position.set(x,0,z);
 scene.add(tree);
}

for(let i=0;i<42;i++){
 const angle=Math.random()*Math.PI*2;
 const radius=18+Math.random()*62;
 const x=Math.cos(angle)*radius;
 const z=Math.sin(angle)*radius;
 if(Math.hypot(x,z)>82) continue;
 if(Math.hypot(x,z-25)<12) continue;
 if(Math.hypot(x,z+75)<13) continue;
 makeTree(x,z);
}

// ROCKS
for(let i=0;i<25;i++){
 const angle=Math.random()*Math.PI*2;
 const radius=15+Math.random()*65;
 const rock=new THREE.Mesh(
  new THREE.DodecahedronGeometry(1+Math.random()*1.5,0),
  new THREE.MeshLambertMaterial({color:0x777c80})
 );
 rock.position.set(Math.cos(angle)*radius,.5,Math.sin(angle)*radius);
 rock.scale.y=.6;
 scene.add(rock);
}

// SMALL HOUSE
const house=new THREE.Group();
const base=new THREE.Mesh(
 new THREE.BoxGeometry(7,4,6),
 new THREE.MeshLambertMaterial({color:0xc78b55})
);
base.position.y=2;
house.add(base);

const roof=new THREE.Mesh(
 new THREE.ConeGeometry(5.4,3.5,4),
 new THREE.MeshLambertMaterial({color:0x923f32})
);
roof.position.y=5.4;
roof.rotation.y=Math.PI/4;
house.add(roof);
house.position.set(-23,0,-12);
scene.add(house);

// CRYSTALS
const crystals=[];
const crystalMaterial=new THREE.MeshLambertMaterial({
 color:0x37e5ff,
 emissive:0x087caa
});

for(let i=0;i<12;i++){
 const angle=i*2.4;
 const radius=15+(i%4)*12;
 const crystal=new THREE.Mesh(
  new THREE.OctahedronGeometry(.85),
  crystalMaterial
 );
 crystal.position.set(
  Math.cos(angle)*radius,
  1.5,
  Math.sin(angle)*radius
 );
 scene.add(crystal);
 crystals.push(crystal);
}

// PORTAL
const portal=new THREE.Group();
const ring=new THREE.Mesh(
 new THREE.TorusGeometry(3,0.4,8,24),
 new THREE.MeshLambertMaterial({
  color:0xffcf40,
  emissive:0x805000
 })
);
ring.position.y=3.5;
portal.add(ring);

const portalLight=new THREE.PointLight(0xffc744,2,15);
portalLight.position.y=3;
portal.add(portalLight);
portal.position.set(0,0,-75);
scene.add(portal);

// CONTROLS
const keys={};
let started=false;
let jumping=false;
let velocityY=0;
let collected=0;
let won=false;

addEventListener("keydown",e=>{
 keys[e.key.toLowerCase()]=true;
 if(e.code==="Space") e.preventDefault();
});
addEventListener("keyup",e=>{
 keys[e.key.toLowerCase()]=false;
});

document.querySelectorAll("#touch button").forEach(button=>{
 const key=button.dataset.key;
 button.addEventListener("pointerdown",e=>{
  e.preventDefault();keys[key]=true;
 });
 button.addEventListener("pointerup",()=>keys[key]=false);
 button.addEventListener("pointerleave",()=>keys[key]=false);
 button.addEventListener("pointercancel",()=>keys[key]=false);
});

document.getElementById("start").onclick=()=>{
 started=true;
 document.getElementById("menu").style.display="none";
};

function update(){
 if(!started || won) return;

 let dx=0,dz=0;
 if(keys["w"]||keys["arrowup"]) dz-=1;
 if(keys["s"]||keys["arrowdown"]) dz+=1;
 if(keys["a"]||keys["arrowleft"]) dx-=1;
 if(keys["d"]||keys["arrowright"]) dx+=1;

 const moving=Math.hypot(dx,dz)>0;
 if(moving){
  const length=Math.hypot(dx,dz);
  dx/=length;dz/=length;
  const speed=keys["shift"]?0.23:0.13;
  player.position.x+=dx*speed;
  player.position.z+=dz*speed;
  player.rotation.y=Math.atan2(dx,dz);
 }

 // ISLAND BOUNDARY
 const distance=Math.hypot(player.position.x,player.position.z);
 if(distance>84){
  player.position.x*=84/distance;
  player.position.z*=84/distance;
 }

 // JUMP
 if(keys[" "] && !jumping){
  jumping=true;
  velocityY=.24;
 }
 player.position.y+=velocityY;
 velocityY-=.012;
 if(player.position.y<=0){
  player.position.y=0;
  velocityY=0;
  jumping=false;
 }

 // CAMERA FOLLOW
 const target=new THREE.Vector3(
  player.position.x,
  player.position.y+5,
  player.position.z+10
 );
 camera.position.lerp(target,.09);
 camera.lookAt(
  player.position.x,
  player.position.y+1.4,
  player.position.z
 );

 // COLLECT CRYSTALS
 crystals.forEach((crystal,index)=>{
  if(!crystal.visible)return;
  crystal.rotation.y+=.035;
  crystal.position.y=1.5+Math.sin(Date.now()*.003+index)*.25;

  if(crystal.position.distanceTo(
   new THREE.Vector3(player.position.x,1.5,player.position.z)
  )<2.1){
   crystal.visible=false;
   collected++;
   document.getElementById("score").textContent=collected+" / 12";
   document.getElementById("message").textContent=
    "Crystal collected! "+collected+" / 12";
  }
 });

 // PORTAL CHECK
 portal.rotation.y+=.003;
 if(player.position.distanceTo(portal.position)<5){
  if(collected>=12){
   won=true;
   document.getElementById("message").textContent=
    "MISSION COMPLETE! You discovered the ancient portal!";
  }else{
   document.getElementById("message").textContent=
    "Collect all 12 crystals before entering the portal!";
  }
 }
}

function animate(){
 requestAnimationFrame(animate);
 update();
 renderer.render(scene,camera);
}
animate();

addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
